<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>
    <h2>Fill up the registration form</h1>
        <form action="" method="get">
            <table>
                <tr>
                    <td><label for="name">Name:</label></td>
                    <td><input type="text" id="name" name="name" placeholder="Enter your name" required></td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input type="email" id="email" name="email" placeholder="Enter your email"  required></td>
                </tr>
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td><input type="password" id="password" name="password" placeholder="Enter your password" required></td>
                </tr>
                <tr>
                    <td><label for="age">Age:</label></td>
                    <td><input type="number" id="age" name="age" placeholder="Enter your age" required></td>
                </tr>
                <tr>
                    <td><label for="DOB">Date of Birth:</label></td>
                    <td><input type="date" id="DOB" name="DOB" required></td>
                </tr>
                <tr>
                    <td><label for="gender">Gender:</label></td>
                    <td>
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female" required>
                        <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="department">Department:</label></td>
                    <td>
                        <select id ="department" name="department">
                            <option value="CSE">CSE</option>
                            <option value="EEE">EEE</option>
                            <option value="ME">ME</option>
                            <option value="BBA">BBA</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="file">Upload File:</label></td>
                    <td><input type="file" id="file" name="file" required></td>
                </tr>
                <tr>
                    <td><label for="address">Address:</label></td>
                    <td><textarea id="address" name="address" placeholder="Enter your address" required></textarea></td>
                </tr>
                <tr>
                    <td>Terms and Conditions</td>
                    <td><input type="checkbox" id="terms" name="terms" required><label>I agree to the terms and conditions</label></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button type="submit">Sign Up</button></td>
                </tr>
            </table>
        </form>
        <p><i>Already have an account?</i> <a href="task1.html">Login here</a></p>

</body>
</html>
